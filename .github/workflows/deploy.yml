name: Build & Release Native Binary

on:
  push:
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 1.0.0 - leave empty to use tag/default)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-native:
    name: Build GraalVM Native Image (Linux x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup GraalVM JDK 21
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: 'graalvm-community'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          native-image-job-reports: 'true'

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Extract Version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF_NAME}"
            VERSION="${TAG_NAME#v}"
          else
            VERSION="0.1.0-SNAPSHOT"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "CI_VERSION=$VERSION" >> $GITHUB_ENV
          echo "Building version: $VERSION"

      - name: Cache sbt & native-image cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.sbt
            ~/.ivy2/cache
            ~/.cache/native-image
          key: ${{ runner.os }}-sbt-graalvm-${{ hashFiles('**/build.sbt', '**/project/**') }}
          restore-keys: |
            ${{ runner.os }}-sbt-graalvm-

      - name: Run Tests
        run: sbt test

      - name: Build Native Binary
        run: sbt nativeImage

      - name: Prepare Release Artifacts
        run: |
          mkdir -p dist
          cp target/native-image/polyomino dist/polyomino-x86_64-linux
          chmod +x dist/polyomino-x86_64-linux

          # Create standalone tarball distribution
          mkdir -p dist/bundle/bin
          cp target/native-image/polyomino dist/bundle/bin/polyomino
          cp -r config zsh themes bootstrap.sh dist/bundle/ 2>/dev/null || true
          tar -czf dist/polyomino-v${{ steps.version.outputs.VERSION }}-x86_64-linux.tar.gz -C dist/bundle .

          # Generate SHA256 checksums
          cd dist
          sha256sum polyomino-x86_64-linux polyomino-v${{ steps.version.outputs.VERSION }}-x86_64-linux.tar.gz > SHA256SUMS.txt
          cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.version.outputs.VERSION) }}
          name: Release ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.version.outputs.VERSION) }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            dist/polyomino-x86_64-linux
            dist/polyomino-v${{ steps.version.outputs.VERSION }}-x86_64-linux.tar.gz
            dist/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
