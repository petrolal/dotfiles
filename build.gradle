import java.nio.file.Files
import java.nio.file.Paths

plugins {
    id 'org.jetbrains.kotlin.jvm' apply false
    id 'org.graalvm.buildtools.native' apply false
    id 'org.springframework.boot' apply false
}

defaultTasks 'all'

def impFile = layout.projectDirectory.file('bin/imp').asFile

List<String> getDeployFlags() {
    def raw = (
        project.findProperty('deployFlags')
            ?: project.findProperty('flags')
            ?: project.findProperty('args')
            ?: System.getenv('DEPLOY_FLAGS')
            ?: ''
        ).toString().trim()
    return raw.split(/\s+/).findAll { it }
}

static boolean isCommandAvailable(String cmd) {
    try {
        def proc = new ProcessBuilder('which', cmd).redirectErrorStream(true).start()
        return proc.waitFor() == 0
    } catch (Exception ignored) {
        return false
    }
}

// ---------------------------------------------------------------------------
// Native Plugins (C++ / Qt6 Quick 3D)
// ---------------------------------------------------------------------------

tasks.register('compileRetroRoom', Exec) {
    group = 'Plugins'
    description = 'Compile C++ RetroRoom Qt6 QML plugin using CMake & Ninja.'
    def pluginSrc = layout.projectDirectory.dir('plugins/retroroom').asFile
    def pluginBuild = layout.projectDirectory.dir('build/plugins/retroroom').asFile
    workingDir = pluginSrc
    doFirst {
        pluginBuild.mkdirs()
    }

    def hasNinja = isCommandAvailable('ninja')
    def hasQt6 = System.getenv('Qt6_DIR') != null || (System.getenv('CMAKE_PREFIX_PATH')?.contains('qtbase') ?: false)
    if (hasNinja && hasQt6) {
        commandLine('sh', '-c', """
            cmake -B "${pluginBuild.absolutePath}" -S "${pluginSrc.absolutePath}" -G Ninja -DCMAKE_BUILD_TYPE=Release
            cmake --build "${pluginBuild.absolutePath}" --parallel
        """)
    } else {
        commandLine('nix', 'develop', projectDir.absolutePath + '#room', '--command', 'sh', '-c', """
            cmake -B "${pluginBuild.absolutePath}" -S "${pluginSrc.absolutePath}" -G Ninja -DCMAKE_BUILD_TYPE=Release
            cmake --build "${pluginBuild.absolutePath}" --parallel
        """)
    }
}

tasks.register('testRetroRoom', Exec) {
    group = 'Plugins'
    description = 'Run Qt Test suite for RetroRoom C++ plugin.'
    dependsOn('compileRetroRoom')
    def pluginBuild = layout.projectDirectory.dir('build/plugins/retroroom').asFile
    workingDir = pluginBuild

    def hasNinja = isCommandAvailable('ninja')
    def hasQt6 = System.getenv('Qt6_DIR') != null || (System.getenv('CMAKE_PREFIX_PATH')?.contains('qtbase') ?: false)
    if (hasNinja && hasQt6 && isCommandAvailable('ctest')) {
        commandLine('ctest', '--test-dir', pluginBuild.absolutePath, '--output-on-failure')
    } else {
        commandLine('nix', 'develop', projectDir.absolutePath + '#room', '--command', 'ctest', '--test-dir', pluginBuild.absolutePath, '--output-on-failure')
    }
}

// ---------------------------------------------------------------------------
// Unified Build & Verification Tasks
// ---------------------------------------------------------------------------

tasks.register('nativeCompile') {
    group = 'Build'
    description = 'Compile native binary of imp CLI.'
    dependsOn(':cli:nativeCompile')
}

tasks.register('all') {
    group = 'Build'
    description = 'Compile native GraalVM imp and C++ QML plugin (default goal).'
    dependsOn(':cli:nativeCompile', 'compileRetroRoom')
}

tasks.register('checkAgs', Exec) {
    group = 'Verification'
    description = 'Verify and bundle AGS TypeScript bar application.'
    def agsDir = layout.projectDirectory.dir('apps/ags').asFile
    workingDir = agsDir
    commandLine('ags', 'bundle', 'app.ts', '/dev/null', '-r', agsDir.absolutePath)
}

tasks.register('test') {
    group = 'Verification'
    description = 'Run all test suites across modules (Kotlin JUnit + C++ Qt Test + AGS bundle).'
    dependsOn(':cli:test', 'testRetroRoom', 'checkAgs')
}

tasks.register('check') {
    group = 'Verification'
    description = 'Run tests and verify imp dry-run deploy.'
    dependsOn('test', 'nativeCompile')
    doLast {
        println('==> Running dry-run deploy check...')
        exec {
            commandLine(impFile.absolutePath, '--dry-run')
        }
