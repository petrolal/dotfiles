#################################
#   Abyssal Biopunk / Infernal Retro
#   Picom Compositor Configuration
#################################

# Shadows: hard-edged drop shadow (offset 2 2, radius 1, color #000000, opacity 0.95)
shadow = true;
shadow-radius = 1;
shadow-opacity = 0.95;
shadow-offset-x = 2;
shadow-offset-y = 2;
shadow-color = "#000000";

shadow-exclude = [
  "name = 'Notification'",
  "class_g = 'Conky'",
  "class_g ?= 'Notify-osd'",
  "class_g = 'Cairo-clock'",
  "_GTK_FRAME_EXTENTS@"
];

# Fading & Animations (Zero animations, no fading)
fading = false;
animations = false;

# Transparency / Opacity (100% opacity, no blur)
frame-opacity = 1.0;
inactive-opacity = 1.0;
active-opacity = 1.0;
inactive-opacity-override = false;

# Geometry: Strict 0px corner rounding
corner-radius = 0;
round-borders = 0;

# Blur: Zero blur
blur-method = "none";
blur-strength = 0;

# General Settings
backend = "xrender";
vsync = true;
mark-wmwin-focused = true;
mark-ovldir-focused = true;
detect-rounded-corners = false;
detect-client-opacity = true;
detect-transient = true;
use-damage = true;
log-level = "warn";
