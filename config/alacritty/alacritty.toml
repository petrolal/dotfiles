[window]
padding = { x = 6, y = 6 }
dynamic_padding = false
opacity = 0.94

[font]
size = 11.0
normal = { family = "Terminus", style = "Regular" }
bold   = { family = "Terminus", style = "Bold" }

[colors.primary]
background = "#070406"
foreground = "#d9cbca"

[colors.cursor]
text   = "#070406"
