-- Abyssal Biopunk / Infernal Retro conky overlay: system stats, clock, same
-- palette as config/xfce4/terminal/terminalrc and config/picom/picom.conf.
conky.config = {
    alignment = 'top_right',
    background = false,
    border_width = 0,
    cpu_avg_samples = 2,
    net_avg_samples = 2,
    double_buffer = true,
    draw_shades = false,
    draw_outline = false,
    draw_borders = false,
    draw_graph_borders = false,
    use_xft = true,
    font = 'JetBrainsMono Nerd Font:size=10',
    gap_x = 24,
    gap_y = 48,
    minimum_width = 260,
    net_avg_samples = 2,
    no_buffers = true,
    out_to_console = false,
    out_to_ncurses = false,
    out_to_stderr = false,
    extra_newline = false,
    own_window = true,
    own_window_type = 'desktop',
    own_window_argb_visual = true,
    own_window_argb_value = 0,
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    own_window_transparent = true,
    stippled_borders = 0,
    update_interval = 1.0,
    uppercase = false,
    use_spacer = 'none',
    show_graph_scale = false,
    show_graph_range = false,
    default_color = 'FFFFFF',
    color1 = '9E2A2B', -- accent red, matches palette index 1
    color2 = 'BD7B2A', -- ember amber, matches palette index 2
    color0 = '16171D', -- background, matches terminal ColorBackground
};

conky.text = [[
${color1}${font JetBrainsMono Nerd Font:size=22}${time %H:%M}${font}
${color default_color}${time %A, %d %B %Y}

${color1}SYSTEM ${hr 2}
${color default_color}Uptime:  ${color2}${uptime}
${color default_color}CPU:     ${color2}${cpu cpu0}% ${cpubar cpu0 6,120}
${color default_color}RAM:     ${color2}${mem} / ${memmax} ${membar 6,120}
${color default_color}Disk /:  ${color2}${fs_used /} / ${fs_size /} ${fs_bar 6,120 /}

${color1}NETWORK ${hr 2}
${color default_color}Down:    ${color2}${downspeed}
${color default_color}Up:      ${color2}${upspeed}
]];
