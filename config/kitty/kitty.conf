# ~/.config/kitty/kitty.conf
# Production terminal config — Catppuccin (flavor selectable), Wayland-native, Nerd Font.

font_family      JetBrainsMono Nerd Font
bold_font        JetBrainsMono Nerd Font Bold
italic_font      JetBrainsMono Nerd Font Italic
bold_italic_font JetBrainsMono Nerd Font Bold Italic
font_size 11.0

# Wayland-native rendering (kitty auto-detects; this just documents intent).
linux_display_server wayland

# Clipboard — kitty uses wl-clipboard automatically under Wayland; no extra config required.
clipboard_control write-clipboard write-primary read-clipboard read-primary
copy_on_select clipboard

# Sane scrollback / performance
scrollback_lines 10000
enable_audio_bell no
visual_bell_duration 0
window_alert_on_bell no
notify_on_cmd_finish never
update_check_interval 0

# Shell
shell zsh
shell_integration enabled

# Window
window_padding_width 6
confirm_os_window_close 0
hide_window_decorations yes
background_opacity 0.82
background_blur 1

# Tabs (CAD precision separator style matching polyomino matrix dividers)
tab_bar_edge bottom
tab_bar_style separator
tab_separator " ┊ "
tab_title_template " {title} "
active_tab_font_style bold
inactive_tab_font_style normal

# ── Color scheme — generated by `polyomino-theme`, do not edit by hand.
# Run `polyomino-theme list` to see Catppuccin and cloud choices, then use
# `polyomino-theme set <flavor>` to change it.
include colors.conf

