# hypridle.conf --- idle-triggered screensaver via quickshell
# License: GPL-3.0-or-later
#
# `qs ipc call lockscreen lock` below is the same command SUPER+L runs via
# `imp lock` (keybindings.lua / DesktopCommands.kt) -- deliberately called
# directly here rather than through imp_bin. imp lock is a pure passthrough
# to this exact command today, so routing a timer-triggered idle hook
# through a native-image binary + its $DOTFILES_DIR path resolution would
# add a new failure mode for no behavioral gain. Revisit if `imp lock` ever
# grows real logic (logging, pre-lock checks, etc.) that this should share.

general {
    lock_cmd = qs ipc call lockscreen lock
    inhibit_sleep = 0
    ignore_dbus_inhibit = true
    ignore_systemd_inhibit = true
    ignore_wayland_inhibit = true
}

listener {
    timeout = 300
    on-timeout = qs ipc call screensaver on
    on-resume = qs ipc call screensaver off
}

listener {
    timeout = 600
    on-timeout = qs ipc call lockscreen lock
}
