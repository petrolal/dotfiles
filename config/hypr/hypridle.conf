# hypridle.conf --- idle-triggered screensaver via quickshell
# License: GPL-3.0-or-later

general {
    inhibit_sleep = 0
    ignore_dbus_inhibit = true
    ignore_systemd_inhibit = true
    ignore_wayland_inhibit = true
}

listener {
    timeout = 300
    on-timeout = qs ipc call screensaver on
    on-resume = qs ipc call screensaver off
}
