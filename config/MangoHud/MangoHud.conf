# MangoHud configuration — polyomino-dotfiles
# Displays a compact performance overlay in the top-left corner.
# Toggle with: Shift+F12 (default keybind)

##########################################################################
# Position & Appearance
##########################################################################
position=top-left
background_alpha=0.5
font_size=22
text_color=FFFFFF
background_color=020202
alpha=0.9
round_corners=6
table_columns=3
hud_compact

##########################################################################
# CPU
##########################################################################
cpu_stats
cpu_load_change
cpu_load_color=39F900,FDFD09,B22222
cpu_temp

##########################################################################
# GPU
##########################################################################
gpu_stats
gpu_load_change
gpu_load_color=39F900,FDFD09,B22222
gpu_temp
vram

##########################################################################
# Memory
##########################################################################
ram

##########################################################################
# Frame timing
##########################################################################
fps
frametime
frame_timing=1
fps_limit_method=late

##########################################################################
# Vulkan / API info (shown on startup for 10 seconds then hidden)
##########################################################################
gpu_name
vulkan_driver
wine

##########################################################################
# Logging (disabled by default; toggle with Shift+F2)
##########################################################################
log_duration=30
output_folder=/tmp

##########################################################################
# Toggle keybind
##########################################################################
toggle_hud=Shift_R+F12
toggle_fps_limit=Shift_R+F1
toggle_logging=Shift_L+F2
