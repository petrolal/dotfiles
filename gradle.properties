# Tell Gradle to run the Gradle Daemon on OpenJDK 21 to avoid Kotlin DSL compiler bugs with Java 25
org.gradle.java.home=/nix/store/r5yyzs1n6hrs3n6kjmxlf8dwynbif5mq-openjdk-21.0.12.1+1
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
# Kotlin/Native's JVM-hosted compiler (used by :plugin-native) segfaults in
# its own cinterop/libffi cleanup on daemon shutdown after a successful
# build (G1 GC barrier crash inside ffiFreeClosure) -- the .so it produces
# is unaffected, but a persistent compiler daemon makes every subsequent
# build in the same Gradle daemon crash too. Disabling it trades a little
# build speed for not taking the whole Gradle daemon down each time.
kotlin.native.disableCompilerDaemon=true
